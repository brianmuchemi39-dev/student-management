<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Management System</title>
</head>

<body>
    <header>
        <h1>Student Management System</h1>
        <p>Manage student records and academic performance</p>
    </header>
    <main>
        <!--student REgistration Form-->
        <section>
            <h2>Register New student</h2>

            <form action="Register student" id="studentForm">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" Placeholder="Enter student name" required>

                <label for="studentEmail">Email Address</label>
                <input type="text" id="studentEmail" placeholder="Enter email address" required>

                <label for="studentmarks">Student Marks</label>
                <input type="number" id="studentMarks" placeholder="Enter marks (0-100)" min="0" max="100" required>

                <button type="submit">Add student</button>

            </form>
            <p id="message"></p>
           
        </section>

         <!--student records table-->

         <section>
            <h2>Students records</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Marks</th>
                        <th>Grade</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                   <!--students record will appear here-->
                </tbody>
            </table>
         </section>


    </main>
    <script src="script.js"></script>
</body>

</html>
